<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }

        .container {
            background: rgba(0, 0, 0, 0.85);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.6);
        }

        h1 {
            text-align: center;
            font-size: 3.5em;
            margin-bottom: 25px;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.6);
            letter-spacing: 10px;
        }

        .game-area {
            display: flex;
            gap: 35px;
            align-items: flex-start;
        }

        #gameCanvas {
            border: 5px solid #555;
            background: #000;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
            border-radius: 5px;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.15);
            padding: 25px;
            border-radius: 12px;
            min-width: 220px;
            backdrop-filter: blur(10px);
        }

        .info-box h2 {
            font-size: 1.4em;
            margin-bottom: 12px;
            color: #ffd700;
        }

        .score {
            font-size: 2.8em;
            color: #ffd700;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .controls {
            font-size: 1em;
            line-height: 2;
        }

        .controls p {
            margin: 5px 0;
        }

        .game-over, .paused {
            background: rgba(220, 38, 38, 0.95);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            animation: pulse 1s infinite;
        }

        .paused {
            background: rgba(251, 191, 36, 0.95);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>TETRIS</h1>
        <div class="game-area">
            <canvas id="gameCanvas" width="300" height="600"></canvas>
            <div class="sidebar">
                <div class="info-box">
                    <h2>Pontuação</h2>
                    <div class="score" id="score">0</div>
                </div>
                <div class="info-box controls">
                    <h2>Controles</h2>
                    <p>⬅️ ➡️ Mover</p>
                    <p>⬆️ Girar</p>
                    <p>⬇️ Acelerar</p>
                    <p>Espaço: Drop</p>
                    <p>P: Pausar</p>
                </div>
                <div id="message"></div>
            </div>
        </div>
    </div>
    <script>
        // Variáveis do Canvas
        var canvas = document.getElementById('gameCanvas');
        var ctx = canvas.getContext('2d');
        var scoreEl = document.getElementById('score');
        var messageEl = document.getElementById('message');

        // Constantes do Jogo
        var BOARD_WIDTH = 10;
        var BOARD_HEIGHT = 20;
        var CELL_SIZE = 30;

        // Formas das Peças
        var SHAPES = {
            I: [[1, 1, 1, 1]],
            O: [[1, 1], [1, 1]],
            T: [[0, 1, 0], [1, 1, 1]],
            S: [[0, 1, 1], [1, 1, 0]],
            Z: [[1, 1, 0], [0, 1, 1]],
            J: [[1, 0, 0], [1, 1, 1]],
            L: [[0, 0, 1], [1, 1, 1]]
        };

        // Cores das Peças
        var COLORS = {
            I: '#00f0f0',
            O: '#f0f000',
            T: '#a000f0',
            S: '#00f000',
            Z: '#f00000',
            J: '#0000f0',
            L: '#f0a000'
        };

        // Estado do Jogo
        var board = createEmptyBoard();
        var currentPiece = null;
        var position = { x: 0, y: 0 };
        var score = 0;
        var gameOver = false;
        var isPaused = false;
        var dropInterval;

        // Cria tabuleiro vazio
        function createEmptyBoard() {
            var b = [];
            for (var i = 0; i < BOARD_HEIGHT; i++) {
                var row = [];
                for (var j = 0; j < BOARD_WIDTH; j++) {
                    row.push(0);
                }
                b.push(row);
            }
            return b;
        }

        // Gera peça aleatória
        function getRandomPiece() {
            var shapes = Object.keys(SHAPES);
            var randomShape = shapes[Math.floor(Math.random() * shapes.length)];
            return {
                shape: SHAPES[randomShape],
                type: randomShape
            };
        }

        // Verifica colisão
        function checkCollision(piece, pos) {
            for (var y = 0; y < piece.shape.length; y++) {
                for (var x = 0; x < piece.shape[y].length; x++) {
                    if (piece.shape[y][x]) {
                        var newX = pos.x + x;
                        var newY = pos.y + y;
                        
                        if (newX < 0 || newX >= BOARD_WIDTH || newY >= BOARD_HEIGHT) {
                            return true;
                        }
                        
                        if (newY >= 0 && board[newY][newX]) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        // Mescla peça no tabuleiro
        function mergePiece() {
            for (var y = 0; y < currentPiece.shape.length; y++) {
                for (var x = 0; x < currentPiece.shape[y].length; x++) {
                    if (currentPiece.shape[y][x]) {
                        var boardY = position.y + y;
                        var boardX = position.x + x;
                        if (boardY >= 0) {
                            board[boardY][boardX] = currentPiece.type;
                        }
                    }
                }
            }
        }

        // Remove linhas completas
        function clearLines() {
            var linesCleared = 0;
            var newBoard = [];
            
            for (var i = 0; i < board.length; i++) {
                var row = board[i];
                var isFull = true;
                
                for (var j = 0; j < row.length; j++) {
                    if (row[j] === 0) {
                        isFull = false;
                        break;
                    }
                }
                
                if (!isFull) {
                    newBoard.push(row);
                } else {
                    linesCleared++;
                }
            }
            
            while (newBoard.length < BOARD_HEIGHT) {
                var emptyRow = [];
                for (var k = 0; k < BOARD_WIDTH; k++) {
                    emptyRow.push(0);
                }
                newBoard.unshift(emptyRow);
            }
            
            board = newBoard;
            
            if (linesCleared > 0) {
                score += linesCleared * 100;
                scoreEl.textContent = score;
            }
        }

        // Cria nova peça
        function spawnPiece() {
            var piece = getRandomPiece();
            var startX = Math.floor(BOARD_WIDTH / 2) - Math.floor(piece.shape[0].length / 2);
            var startPos = { x: startX, y: 0 };
            
            if (checkCollision(piece, startPos)) {
                gameOver = true;
                showMessage('game-over');
                clearInterval(dropInterval);
                return;
            }
            
            currentPiece = piece;
            position = startPos;
        }

        // Move peça para baixo
        function moveDown() {
            if (!currentPiece || isPaused || gameOver) return;
            
            var newPos = { x: position.x, y: position.y + 1 };
            
            if (checkCollision(currentPiece, newPos)) {
                mergePiece();
                clearLines();
                spawnPiece();
            } else {
                position = newPos;
            }
            draw();
        }

        // Move peça horizontalmente
        function moveHorizontal(direction) {
            if (!currentPiece || isPaused || gameOver) return;
            
            var newPos = { x: position.x + direction, y: position.y };
            
            if (!checkCollision(currentPiece, newPos)) {
                position = newPos;
                draw();
            }
        }

        // Rotaciona peça
        function rotate() {
            if (!currentPiece || isPaused || gameOver) return;
            
            var rotated = [];
            for (var i = 0; i < currentPiece.shape[0].length; i++) {
                var row = [];
                for (var j = currentPiece.shape.length - 1; j >= 0; j--) {
                    row.push(currentPiece.shape[j][i]);
                }
                rotated.push(row);
            }
            
            var rotatedPiece = { shape: rotated, type: currentPiece.type };
            
            if (!checkCollision(rotatedPiece, position)) {
                currentPiece = rotatedPiece;
                draw();
            }
        }

        // Drop rápido
        function hardDrop() {
            if (!currentPiece || isPaused || gameOver) return;
            
            while (!checkCollision(currentPiece, { x: position.x, y: position.y + 1 })) {
                position.y++;
            }
            mergePiece();
            clearLines();
            spawnPiece();
            draw();
        }

        // Desenha o jogo
        function draw() {
            // Limpa canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Desenha tabuleiro
            for (var y = 0; y < BOARD_HEIGHT; y++) {
                for (var x = 0; x < BOARD_WIDTH; x++) {
                    if (board[y][x]) {
                        ctx.fillStyle = COLORS[board[y][x]];
                        ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                        ctx.strokeStyle = '#000';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                    }
                }
            }
            
            // Desenha peça atual
            if (currentPiece) {
                ctx.fillStyle = COLORS[currentPiece.type];
                for (var y = 0; y < currentPiece.shape.length; y++) {
                    for (var x = 0; x < currentPiece.shape[y].length; x++) {
                        if (currentPiece.shape[y][x]) {
                            var drawX = (position.x + x) * CELL_SIZE;
                            var drawY = (position.y + y) * CELL_SIZE;
                            ctx.fillRect(drawX, drawY, CELL_SIZE, CELL_SIZE);
                            ctx.strokeStyle = '#000';
                            ctx.lineWidth = 2;
                            ctx.strokeRect(drawX, drawY, CELL_SIZE, CELL_SIZE);
                        }
                    }
                }
            }
            
            // Desenha grade
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            for (var x = 0; x <= BOARD_WIDTH; x++) {
                ctx.beginPath();
                ctx.moveTo(x * CELL_SIZE, 0);
                ctx.lineTo(x * CELL_SIZE, canvas.height);
                ctx.stroke();
            }
            for (var y = 0; y <= BOARD_HEIGHT; y++) {
                ctx.beginPath();
                ctx.moveTo(0, y * CELL_SIZE);
                ctx.lineTo(canvas.width, y * CELL_SIZE);
                ctx.stroke();
            }
        }

        // Mostra mensagens
        function showMessage(type) {
            if (type === 'game-over') {
                messageEl.innerHTML = '<div class="game-over"><h2>GAME OVER!</h2><button onclick="resetGame()">Jogar Novamente</button></div>';
            } else if (type === 'paused') {
                messageEl.innerHTML = '<div class="paused"><h2>PAUSADO</h2></div>';
            } else {
                messageEl.innerHTML = '';
            }
        }

        // Reinicia o jogo
        function resetGame() {
            board = createEmptyBoard();
            currentPiece = null;
            score = 0;
            scoreEl.textContent = score;
            gameOver = false;
            isPaused = false;
            messageEl.innerHTML = '';
            spawnPiece();
            clearInterval(dropInterval);
            dropInterval = setInterval(moveDown, 1000);
            draw();
        }

        // Controles do teclado
        window.addEventListener('keydown', function(e) {
            if (gameOver && e.key !== 'Enter') return;
            
            switch(e.key) {
                case 'ArrowLeft':
                    moveHorizontal(-1);
                    break;
                case 'ArrowRight':
                    moveHorizontal(1);
                    break;
                case 'ArrowDown':
                    moveDown();
                    break;
                case 'ArrowUp':
                    rotate();
                    break;
                case ' ':
                    e.preventDefault();
                    hardDrop();
                    break;
                case 'p':
                case 'P':
                    isPaused = !isPaused;
                    showMessage(isPaused ? 'paused' : '');
                    draw();
                    break;
            }
        });

        // Inicia o jogo
        spawnPiece();
        dropInterval = setInterval(moveDown, 1000);
        draw();
    </script>
</body>
</html>
